<!-- VOLARE 版本標記：v11（2026-09-23）本版更新：修正手機開啟時版面沒有縮放適配的問題（補上 viewport 設定） -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOLARE 後台管理</title>
<style>
  :root{
    --orange:#dc6024;
    --orange-deep:#b8481a;
    --yellow:#e8dc37;
    --ink:#1c1410;
    --paper:#faf6ec;
    --paper-dim:#f0e8d4;
    --night:#171b22;
    --night-2:#212733;
    --line:#e3d8bd;
    --red:#c1402c;
    --green:#3f8a5f;
    --white:#ffffff;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', -apple-system, sans-serif;
    line-height:1.6;
  }
  h1,h2,h3,h4{margin:0;font-weight:900;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  /* ---------- login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(120% 90% at 15% 0%, #f2833f 0%, var(--orange) 45%, var(--orange-deep) 100%);
  }
  .login-card{
    background:var(--white);
    border:3px solid var(--ink);
    border-radius:16px;
    box-shadow:8px 8px 0 var(--ink);
    padding:36px 32px;
    max-width:380px;
    width:100%;
  }
  .login-card .brand{
    font-family:'Archivo Black', sans-serif;
    font-size:1.8rem;
    color:var(--orange-deep);
    margin-bottom:4px;
  }
  .login-card .sub{font-size:.85rem;opacity:.7;margin-bottom:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px;opacity:.8;}
  .field input, .field textarea, .field select{
    width:100%;
    padding:10px 12px;
    border:2px solid var(--line);
    border-radius:8px;
    font-size:.95rem;
    background:var(--white);
    color:var(--ink);
    -webkit-text-fill-color:var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-color:var(--orange);
  }
  .pass-row{position:relative;}
  .pass-row input{padding-right:64px;}
  .pass-toggle{
    position:absolute;
    right:6px;top:50%;
    transform:translateY(-50%);
    background:var(--paper-dim);
    border:1.5px solid var(--line);
    border-radius:6px;
    font-size:.72rem;
    font-weight:700;
    padding:5px 10px;
    color:var(--ink);
  }
  .pass-live{font-size:.72rem;opacity:.6;margin-top:5px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.4em;
    padding:.75em 1.4em;
    font-weight:900;
    font-size:.9rem;
    border:2px solid var(--ink);
    border-radius:999px;
    background:var(--ink);
    color:var(--paper);
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  .btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
  .btn.primary{background:var(--yellow);color:var(--ink);}
  .btn.danger{background:var(--red);color:var(--white);border-color:var(--red);}
  .btn.ghost{background:var(--white);color:var(--ink);}
  .btn.small{padding:.5em 1em;font-size:.78rem;box-shadow:2px 2px 0 var(--ink);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .login-error{color:var(--red);font-size:.82rem;font-weight:700;margin-top:10px;min-height:1.2em;}
  .login-note{font-size:.72rem;opacity:.55;margin-top:18px;}

  /* ---------- app shell ---------- */
  #app-shell{display:none;min-height:100vh;}
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--ink);
    color:var(--white);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .topbar .brand-mark{
    font-family:'Archivo Black', sans-serif;
    color:var(--yellow);
    font-size:1.15rem;
    margin-right:12px;
  }
  .topbar .role-badge{
    font-size:.72rem;
    font-weight:900;
    background:var(--yellow);
    color:var(--ink);
    padding:3px 10px;
    border-radius:999px;
  }
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .save-indicator{font-size:.75rem;opacity:.75;}
  .save-indicator.ok{color:#8fe0af;}
  .save-indicator.err{color:#ff9d8a;}

  .tabs{
    display:flex;
    gap:6px;
    padding:12px 20px;
    background:var(--paper-dim);
    border-bottom:2px solid var(--line);
    overflow-x:auto;
  }
  .tab-btn{
    padding:.6em 1.1em;
    border-radius:999px;
    border:2px solid transparent;
    background:transparent;
    font-weight:700;
    font-size:.85rem;
    color:var(--ink);
    opacity:.6;
    white-space:nowrap;
  }
  .tab-btn.active{
    opacity:1;
    background:var(--white);
    border-color:var(--ink);
  }

  .panel{display:none;padding:28px 20px 80px;max-width:900px;margin:0 auto;}
  .panel.active{display:block;}
  .panel-head{margin-bottom:22px;}
  .panel-head h2{font-size:1.4rem;margin-bottom:4px;}
  .panel-head p{font-size:.85rem;opacity:.65;}

  .card{
    position:relative;
    background:var(--white);
    border:2px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .card-head h3{font-size:1rem;}
  .card-head .tag{
    font-size:.68rem;
    font-weight:900;
    background:var(--paper-dim);
    padding:2px 8px;
    border-radius:999px;
    opacity:.7;
  }

  .lang-field{margin-bottom:14px;}
  .lang-field > label{display:block;font-size:.8rem;font-weight:900;margin-bottom:6px;}
  .lang-tabset{
    display:flex;
    gap:4px;
    margin-bottom:6px;
  }
  .lang-tabset button{
    padding:3px 10px;
    font-size:.7rem;
    font-weight:900;
    border-radius:6px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    opacity:.55;
  }
  .lang-tabset button.active{
    opacity:1;
    background:var(--orange);
    color:var(--white);
    border-color:var(--orange);
  }
  .lang-input-wrap textarea, .lang-input-wrap input{width:100%;}
  .lang-input-wrap{display:none;}
  .lang-input-wrap.active{display:block;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:640px){.row2,.row3{grid-template-columns:1fr;}}

  .upload-box{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    border:2px dashed var(--line);
    border-radius:8px;
    background:var(--paper);
  }
  .upload-preview{
    width:96px;
    border-radius:6px;
    background:var(--paper-dim);
    background-size:cover;
    background-position:center;
    flex-shrink:0;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:1.2rem;
    color:#999;
  }
  .upload-meta{flex:1;font-size:.75rem;opacity:.7;}
  .upload-progress-track{
    width:100%;
    height:6px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
    margin-top:6px;
    display:none;
  }
  .upload-progress-track.active{display:block;}
  .upload-progress-bar{
    height:100%;
    width:0%;
    background:var(--orange);
    transition:width .15s ease;
  }
  .upload-dims{
    font-size:.72rem;
    font-weight:700;
    color:var(--orange-deep, #b8481a);
    background:rgba(220,96,36,.1);
    display:inline-block;
    padding:2px 8px;
    border-radius:999px;
    margin:2px 0 8px;
  }

  .divider{height:1px;background:var(--line);margin:16px 0;}
  .list-item{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:16px;
    margin-bottom:12px;
    position:relative;
  }
  .remove-btn{
    position:absolute;top:10px;right:10px;
    background:var(--red);
    color:var(--white);
    border:none;
    border-radius:999px;
    width:26px;height:26px;
    font-size:.85rem;
    line-height:1;
  }
  .add-btn-row{margin-top:8px;}
  .flash-highlight{
    outline:3px solid var(--orange);
    outline-offset:2px;
    animation: flashBg 1.6s ease;
  }
  @keyframes flashBg{
    0%{background:#fdedd2;}
    100%{background:var(--white);}
  }

  .toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .toggle-row input[type=checkbox]{width:18px;height:18px;}
  .toggle-row label{font-size:.85rem;font-weight:700;}

  .banner{
    padding:12px 16px;
    border-radius:8px;
    font-size:.85rem;
    font-weight:700;
    margin-bottom:18px;
  }
  .banner.warn{background:#fdf1d6;border:1.5px solid #e8c060;color:#7a5a10;}
  .banner.info{background:#e5f0fb;border:1.5px solid #a9c9ea;color:#2a4d75;}

  .save-bar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:6px;
  }
  .save-msg{font-size:.8rem;font-weight:700;}
  .save-msg.ok{color:var(--green);}
  .save-msg.err{color:var(--red);}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>

<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <div class="brand">VOLARE</div>
    <p class="sub">後台管理登入 · 請輸入你所屬權限層級的密碼</p>
    <div class="field">
      <label for="login-pass">密碼</label>
      <div class="pass-row">
        <input type="password" id="login-pass" placeholder="輸入密碼" autocomplete="current-password" autofocus>
        <button type="button" class="pass-toggle" id="pass-toggle-btn">顯示</button>
      </div>
      <p class="pass-live" id="pass-live-count"></p>
    </div>
    <button class="btn primary" id="login-btn" style="width:100%;">登入</button>
    <p class="login-error" id="login-error"></p>
    <p class="login-note" id="login-note"></p>
  </div>
</div>

<div id="app-shell">
  <div class="topbar">
    <div style="display:flex;align-items:center;">
      <span class="brand-mark">VOLARE 後台</span>
      <span class="role-badge" id="role-badge">—</span>
    </div>
    <div class="topbar-right">
      <span class="save-indicator" id="global-status"></span>
      <button class="btn small ghost" id="refresh-btn">重新載入</button>
      <button class="btn small ghost" id="logout-btn">登出</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>

<script>
(function(){
  "use strict";

  // ================= 權限設計 =================
  // admin（最高權限）：所有區塊 + 新增/刪除場館 + 修改三組密碼
  // marketing（行銷）：現正熱映（片名/檔期/海報/備註，含新增刪除片單）、票價資訊、劇院公告、
  //                    主視覺文案與簡介、聯絡資訊/QR code
  // ops（營運）：場館資訊（地址/營業時間/營業狀態，不含新增刪除場館）、
  //              現正熱映（僅能編輯檔期日期，不能改片名/海報/備註/新增刪除）
  var SECTION_DEFS = [
    { id:'showing',   label:'現正熱映' },
    { id:'pricing',   label:'票價資訊' },
    { id:'announce',  label:'劇院公告' },
    { id:'hero',      label:'主視覺與簡介' },
    { id:'contact',   label:'聯絡資訊' },
    { id:'venue',     label:'場館資訊' },
    { id:'system',    label:'系統設定' }
  ];
  // 這是「找不到後台自訂設定時」的預設值；admin 一律固定擁有全部分頁，不可調整、也不會存進資料庫。
  // marketing／ops 的實際權限，改成可以在「系統設定」分頁由 admin 調整並存進後台資料庫
  // （content.systemSettings.rolePermissions），這裡只在資料庫還沒有自訂設定時當作初始值使用。
  var DEFAULT_ROLE_SECTIONS = {
    marketing: ['showing','pricing','announce','hero','contact'],
    ops:       ['venue','showing']
  };
  var ALL_SECTION_IDS = SECTION_DEFS.map(function(s){ return s.id; });
  var ROLE_SECTIONS = {
    admin: ALL_SECTION_IDS.slice(),
    marketing: DEFAULT_ROLE_SECTIONS.marketing.slice(),
    ops: DEFAULT_ROLE_SECTIONS.ops.slice()
  };
  var ROLE_LABEL = { admin:'最高權限', marketing:'行銷', ops:'營運' };

  /** 依目前 content.systemSettings.rolePermissions（若有）重新計算 ROLE_SECTIONS。
   *  admin 永遠是全部分頁，不受自訂設定影響，避免不小心把自己鎖住；
   *  'system'（系統設定）分頁永遠只有 admin 能看，不開放給 marketing／ops 調整。 */
  function recomputeRoleSections(){
    var stored = (content && content.systemSettings && content.systemSettings.rolePermissions) || {};
    ['marketing','ops'].forEach(function(r){
      var list = Array.isArray(stored[r]) ? stored[r].filter(function(id){ return id !== 'system' && ALL_SECTION_IDS.indexOf(id) !== -1; }) : null;
      ROLE_SECTIONS[r] = (list && list.length) ? list : DEFAULT_ROLE_SECTIONS[r].slice();
    });
    ROLE_SECTIONS.admin = ALL_SECTION_IDS.slice();
  }

  // ================= 後台資料來源設定 =================
  // 這裡改為連到「Google Apps Script」寫的簡易 API（取代原本的 Claude db/assets），
  // 讓後台可以搬出 Claude、多人用共用密碼直接連線操作。
  // 請依照部署說明，把你部署好的 Apps Script 網路應用程式網址貼在下面：
  var API_BASE_URL = 'https://script.google.com/macros/s/AKfycbxWO4fgsGuzSnz-4PJTMgnlBc3eztwpQp1zSnKw0x_v0uX6Zwa1x6zy6tJmZaMgKgub/exec';

  // ================= 狀態 =================
  var role = null;
  var authPassword = null; // 登入時輸入的密碼，之後每次寫入都會一併送出讓伺服器端驗證權限
  var content = null;      // 目前編輯中的完整內容物件（深拷貝）
  var currentPanel = null;
  var langTabState = {};   // fieldKey -> 'zh'|'en'|'ja'

  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function esc(s){ return String(s===undefined||s===null?'':s); }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

  function ensureL(v){
    if(v && typeof v === 'object' && ('zh' in v || 'en' in v || 'ja' in v)) return v;
    return { zh: v || '', en:'', ja:'' };
  }

  // ================= 與後台 API 溝通的共用函式 =================
  // GET：讀取公開內容，不需密碼（前台網頁也是打這支 API 取得內容）。
  function apiGet(action){
    var url = API_BASE_URL + '?action=' + encodeURIComponent(action);
    return fetch(url).then(function(r){ return r.json(); });
  }
  // POST：寫入類的動作（登入、儲存、上傳圖片、改密碼）都要帶密碼，由 Apps Script 那端驗證。
  // 注意：body 用 text/plain 而不是 application/json，是為了避開瀏覽器對跨網域 POST
  // 的 CORS 預檢請求（Apps Script 網路應用程式沒有處理 preflight OPTIONS 的機制），
  // Apps Script 那端一樣會把內容當 JSON 字串解析，不影響資料本身。
  function apiPost(action, payload){
    payload = payload || {};
    var body = Object.assign({ action: action }, payload);
    if(body.password === undefined) body.password = authPassword;
    return fetch(API_BASE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); });
  }
  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var result = reader.result; // data:xxx;base64,AAAA...
        var comma = result.indexOf(',');
        resolve(comma === -1 ? result : result.slice(comma + 1));
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // 上傳前先在瀏覽器端把圖片縮小/壓縮，這是「上傳很慢」的主要原因：
  // 手機拍的原圖常常是 4000px 以上、好幾 MB，轉成 base64 後體積會再膨脹約 1/3，
  // 傳給 Apps Script 處理起來就會很慢。這裡限制最長邊到 1800px 並用 JPEG 壓縮，
  // 前台顯示用的解析度綽綽有餘，但檔案可以小非常多。
  // SVG／GIF（含動畫）不處理，直接原檔上傳，避免破壞向量圖或動畫。
  function resizeImageForUpload(file, maxDim){
    return new Promise(function(resolve){
      if(!/^image\/(png|jpeg|jpg|webp)$/.test(file.type)){ resolve(file); return; }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        if(scale >= 1 || !w || !h){ URL.revokeObjectURL(url); resolve(file); return; }
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        var outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        canvas.toBlob(function(blob){
          URL.revokeObjectURL(url);
          if(!blob){ resolve(file); return; }
          resolve(new File([blob], file.name, { type: outType }));
        }, outType, outType === 'image/jpeg' ? 0.85 : undefined);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  /** 上傳圖片專用：改回跟其他動作一樣用 fetch()（不要用 XMLHttpRequest）。
   *  原因：Apps Script 網路應用程式在回應成功時，會用一個轉址到
   *  script.googleusercontent.com 的機制來讓瀏覽器放行跨網域讀取（CORS）。
   *  fetch() 能正確處理這個轉址，但改用 XMLHttpRequest 時，部分瀏覽器／環境會在
   *  這個轉址過程中判定失敗，回報成「網路連線失敗」——這正是上一版圖片上傳
   *  會跳錯誤的原因，跟真正的網路狀況無關。
   *  代價是 fetch() 沒有原生的「已上傳位元組數」事件，所以這裡改用「模擬進度」：
   *  依時間逐漸把進度條推到 90%，實際收到伺服器回應後才跳到 100%，
   *  不是逐位元組的真實進度，但能讓妳知道系統還在處理、大概到哪個階段。 */
  function apiPostUploadImage(payload, onProgress){
    return new Promise(function(resolve, reject){
      var body = Object.assign({ action: 'uploadImage' }, payload || {});
      if(body.password === undefined) body.password = authPassword;
      var pct = 0;
      var timer = setInterval(function(){
        pct = Math.min(90, pct + Math.random() * 10 + 4);
        if(onProgress) onProgress(pct / 100);
      }, 300);
      fetch(API_BASE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      }).then(function(r){
        return r.json().catch(function(){
          throw new Error('伺服器回應格式錯誤（HTTP ' + r.status + '），可能是 Apps Script 部署有誤，請確認已部署「新版本」');
        });
      }).then(function(res){
        clearInterval(timer);
        if(onProgress) onProgress(1);
        if(!res || res.ok !== true){
          reject(new Error((res && (res.message || res.error)) || '伺服器回傳失敗，原因不明'));
          return;
        }
        resolve(res);
      }).catch(function(e){
        clearInterval(timer);
        reject(e instanceof Error ? e : new Error('網路連線失敗，請確認網路狀態後再試一次'));
      });
    });
  }

  // ================= 初始化 =================
  async function init(){
    if(!API_BASE_URL || API_BASE_URL.indexOf('YOUR_APPS_SCRIPT') === 0){
      $('#login-note').textContent = '尚未設定後台資料來源網址（API_BASE_URL）。請依照部署說明，把 Apps Script 網路應用程式網址貼到程式碼最上方的 API_BASE_URL 後再開啟本頁面。';
      $('#login-btn').disabled = true;
      return;
    }

    $('#login-btn').addEventListener('click', doLogin);
    $('#login-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
    $('#login-pass').addEventListener('input', function(){
      var n = $('#login-pass').value.length;
      $('#pass-live-count').textContent = n > 0 ? ('已輸入 ' + n + ' 個字元') : '';
    });
    $('#pass-toggle-btn').addEventListener('click', function(){
      var input = $('#login-pass');
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      $('#pass-toggle-btn').textContent = showing ? '顯示' : '隱藏';
    });
    $('#logout-btn').addEventListener('click', doLogout);
    $('#refresh-btn').addEventListener('click', function(){ loadContent(true); });

    // 嘗試延續本次瀏覽階段的登入狀態（密碼也存在 sessionStorage，
    // 因為每次寫入都要重新送出密碼給伺服器驗證，關閉分頁就會清除）
    var savedRole = null, savedPass = null;
    try{
      savedRole = sessionStorage.getItem('volare_admin_role');
      savedPass = sessionStorage.getItem('volare_admin_pass');
    }catch(e){}
    if(savedRole && savedPass && ROLE_SECTIONS[savedRole]){
      role = savedRole;
      authPassword = savedPass;
      await enterApp();
    }
  }

  async function doLogin(){
    var pass = $('#login-pass').value.trim();
    var errEl = $('#login-error');
    errEl.textContent = '';
    if(!pass){ errEl.textContent = '請輸入密碼'; return; }
    $('#login-btn').disabled = true;
    try{
      var res = await apiPost('login', { password: pass });
      if(!res || !res.ok){
        errEl.textContent = '密碼錯誤，請確認後再試一次';
        $('#login-btn').disabled = false;
        return;
      }
      role = res.role;
      authPassword = pass;
      try{
        sessionStorage.setItem('volare_admin_role', role);
        sessionStorage.setItem('volare_admin_pass', pass);
      }catch(e){}
      await enterApp();
    }catch(e){
      errEl.textContent = '登入時發生錯誤，請確認網路連線或稍後再試';
      $('#login-btn').disabled = false;
    }
  }

  function doLogout(){
    role = null;
    authPassword = null;
    try{
      sessionStorage.removeItem('volare_admin_role');
      sessionStorage.removeItem('volare_admin_pass');
    }catch(e){}
    $('#app-shell').style.display = 'none';
    $('#login-screen').style.display = 'flex';
    $('#login-pass').value = '';
    $('#login-error').textContent = '';
    $('#login-btn').disabled = false;
  }

  async function enterApp(){
    $('#login-screen').style.display = 'none';
    $('#app-shell').style.display = 'block';
    $('#role-badge').textContent = ROLE_LABEL[role] || role;
    await loadContent(false);
    buildTabs();
    var sections = ROLE_SECTIONS[role] || [];
    if(sections.length) showPanel(sections[0]);
  }

  async function loadContent(manual){
    setGlobalStatus('讀取中…', '');
    try{
      var res = await apiGet('getContent');
      if(!res || !res.ok) throw new Error((res && res.error) || 'load_failed');
      content = res.content || defaultContent();
      recomputeRoleSections();
      buildTabs();
      var allowed = ROLE_SECTIONS[role] || [];
      if(currentPanel && allowed.indexOf(currentPanel) === -1){
        currentPanel = null;
        if(allowed.length) showPanel(allowed[0]);
        else $('#panels').innerHTML = '<div class="panel active" style="padding:28px 20px;">目前沒有開放任何分頁權限給妳的角色，請洽最高權限管理人員。</div>';
      } else if(currentPanel){
        renderPanel(currentPanel);
      }
      setGlobalStatus(manual ? '已重新載入最新資料' : '', 'ok');
    }catch(e){
      setGlobalStatus('讀取失敗，請按「重新載入」再試一次', 'err');
    }
  }

  function setGlobalStatus(msg, cls){
    var el = $('#global-status');

    if(msg){ setTimeout(function(){ if(el.textContent===msg){ el.textContent=''; el.className='save-indicator'; } }, 4000); }

  // ================= Tabs =================
  function buildTabs(){
    var wrap = $('#tabs');
    wrap.innerHTML = '';

    SECTION_DEFS.forEach(function(s){
      if(sections.indexOf(s.id) === -1) return;

  function showPanel(id){

      announce: renderAnnouncePanel,

      venue: renderVenuePanel,
      system: renderSystemPanel
    };

  /** 重新渲染後，自動捲動到新增的項目並短暫閃爍提示，避免使用者以為按鈕沒有反應 */
  function focusPanelItem(panelId, opts){
    opts = opts || {};
    requestAnimationFrame(function(){
      var root = document.getElementById('panel-' + panelId);
      if(!root) return;
      var sel = opts.selector || '.card';
      var nodes = root.querySelectorAll(sel);
      if(!nodes.length) return;
      var el = opts.first ? nodes[0] : nodes[nodes.length-1];
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.classList.add('flash-highlight');
      setTimeout(function(){ el.classList.remove('flash-highlight'); }, 1600);
    });
  }

  /** 建立一個三語欄位（zh/en/ja）的編輯元件，multi=是否用 textarea */
  function langField(container, label, valueObj, onChange, multiline, keyForTabState){
    valueObj = ensureL(valueObj);
    var wrap = document.createElement('div');
    wrap.className = 'lang-field';
    var tabKey = keyForTabState || uid('lf');
    if(!langTabState[tabKey]) langTabState[tabKey] = 'zh';

    var labelEl = document.createElement('label');
    labelEl.textContent = label;
    wrap.appendChild(labelEl);

    var tabset = document.createElement('div');
    tabset.className = 'lang-tabset';
    ['zh','en','ja'].forEach(function(lang){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = lang === 'zh' ? '中文' : (lang === 'en' ? 'EN' : 'JA');
      b.className = langTabState[tabKey] === lang ? 'active' : '';
      b.addEventListener('click', function(){
        langTabState[tabKey] = lang;
        $all('.lang-tabset button', wrap).forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        $all('.lang-input-wrap', wrap).forEach(function(x){ x.classList.toggle('active', x.dataset.lang === lang); });
      });
      tabset.appendChild(b);
    });
    wrap.appendChild(tabset);

    ['zh','en','ja'].forEach(function(lang){
      var iw = document.createElement('div');
      iw.className = 'lang-input-wrap' + (langTabState[tabKey] === lang ? ' active' : '');
      iw.dataset.lang = lang;
      var input = document.createElement(multiline ? 'textarea' : 'input');
      if(multiline) input.rows = 3;
      else input.type = 'text';
      input.value = valueObj[lang] || '';
      input.placeholder = lang === 'zh' ? '（必填，其餘語言留空時會自動顯示中文）' : '（可留空，留空則自動顯示中文版）';
      input.addEventListener('input', function(){
        valueObj[lang] = input.value;
        onChange(valueObj);
      });
      iw.appendChild(input);
      wrap.appendChild(iw);
    });

    container.appendChild(wrap);
    return wrap;
  }

  function plainField(container, label, value, onChange, placeholder){
    var wrap = document.createElement('div');
    wrap.className = 'field';
    var labelEl = document.createElement('label');
    labelEl.textContent = label;
    wrap.appendChild(labelEl);
    var input = document.createElement('input');
    input.type = 'text';
    input.value = value || '';
    if(placeholder) input.placeholder = placeholder;
    input.addEventListener('input', function(){ onChange(input.value); });
    wrap.appendChild(input);
    container.appendChild(wrap);
    return wrap;
  }

  function uploadField(container, label, assetIdVal, urlVal, onUploaded, autoSaveFn, dims){
    var wrap = document.createElement('div');
    wrap.className = 'field';
    var labelEl = document.createElement('label');
    labelEl.textContent = label;
    wrap.appendChild(labelEl);

    // dims：{ratio:'3 / 4', text:'建議尺寸 900×1200px（直式 3:4），上傳後會依此比例置中裁切'}
    // 前台圖框比例是固定的，上傳圖片若比例不同會被自動裁切（取正中央），
    // 這裡把前台實際的裁切框比例＋建議像素尺寸直接標示出來，
    // 這樣可以先在自己的圖片軟體裡按這個比例裁好，上傳後就不會被系統再裁到不想要的地方。
    if(dims && dims.text){
      var dimsTag = document.createElement('div');
      dimsTag.className = 'upload-dims';
      dimsTag.textContent = '📐 ' + dims.text;
      wrap.appendChild(dimsTag);
    }

    var box = document.createElement('div');
    box.className = 'upload-box';
    var preview = document.createElement('div');
    preview.className = 'upload-preview';
    if(dims && dims.ratio){
      preview.style.aspectRatio = dims.ratio;
    } else {
      preview.style.height = '96px';
    }
    if(urlVal){
      preview.style.backgroundImage = 'url(' + urlVal + ')';
    } else {
      preview.textContent = '🖼️';
    }
    var meta = document.createElement('div');
    meta.className = 'upload-meta';
    meta.textContent = urlVal ? '已上傳圖片' : '尚未上傳，前台將顯示待上傳佔位圖';

    var progressTrack = document.createElement('div');
    progressTrack.className = 'upload-progress-track';
    var progressBar = document.createElement('div');
    progressBar.className = 'upload-progress-bar';
    progressTrack.appendChild(progressBar);
    meta.appendChild(progressTrack);

    var pickBtn = document.createElement('button');
    pickBtn.className = 'btn small ghost';
    pickBtn.textContent = '上傳圖片';
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/png,image/jpeg,image/webp,image/gif,image/svg+xml';
    fileInput.style.display = 'none';

    pickBtn.addEventListener('click', function(){
      fileInput.click();
    });
    fileInput.addEventListener('change', async function(){
      var f = fileInput.files[0];
      if(!f) return;
      pickBtn.disabled = true;
      pickBtn.textContent = '處理中…';
      progressTrack.classList.add('active');
      progressBar.style.width = '0%';
      meta.textContent = '壓縮圖片中…';
      meta.appendChild(progressTrack);
      try{
        var prepared = await resizeImageForUpload(f, 1800);
        var base64 = await fileToBase64(prepared);
        pickBtn.textContent = '上傳中…';
        meta.textContent = '上傳中… 0%';
        meta.appendChild(progressTrack);
        var res = await apiPostUploadImage({ filename: prepared.name, contentType: prepared.type || 'application/octet-stream', base64: base64 }, function(ratio){
          var pct = Math.round(ratio * 100);
          progressBar.style.width = pct + '%';
          meta.textContent = '上傳中… ' + pct + '%';
          meta.appendChild(progressTrack);
        });
        progressBar.style.width = '100%';
        preview.style.backgroundImage = 'url(' + res.url + ')';
        preview.textContent = '';
        onUploaded(res.id, res.url);
        if(autoSaveFn){
          meta.textContent = '圖片上傳完成，儲存中…';
          meta.appendChild(progressTrack);
          try{
            await autoSaveFn();
            meta.textContent = '已上傳並自動儲存（' + Math.round((res.sizeBytes||0)/1024) + ' KB）';
          }catch(saveErr){
            meta.textContent = '圖片已上傳，但自動儲存失敗：' + (saveErr && saveErr.message ? saveErr.message : String(saveErr));
          }
        } else {
          meta.textContent = '已上傳圖片（' + Math.round((res.sizeBytes||0)/1024) + ' KB），請記得按「儲存變更」';
        }
      }catch(e){
        var msg = (e && e.message) ? e.message : String(e);
        meta.textContent = '上傳失敗：' + msg;
        alert('上傳失敗：' + msg);
      }
      progressTrack.classList.remove('active');
      pickBtn.disabled = false;
      pickBtn.textContent = '上傳圖片';
    });

    box.appendChild(preview);
    box.appendChild(meta);
    box.appendChild(pickBtn);
    box.appendChild(fileInput);
    wrap.appendChild(box);
    container.appendChild(wrap);
    return wrap;
  }

  function saveBar(container, onSave){
    var bar = document.createElement('div');
    bar.className = 'save-bar';
    var btn = document.createElement('button');
    btn.className = 'btn primary';
    btn.textContent = '儲存變更';
    var msg = document.createElement('span');
    msg.className = 'save-msg';
    btn.addEventListener('click', async function(){
      btn.disabled = true;
      msg.textContent = '';
      msg.className = 'save-msg';
      try{
        await onSave();
        msg.textContent = '已儲存';
        msg.className = 'save-msg ok';
      }catch(e){
        var reason = (e && (e.message || e.code)) || 'unknown';
        msg.textContent = '儲存失敗：' + reason;
        msg.className = 'save-msg err';
      }
      btn.disabled = false;
      setTimeout(function(){ msg.textContent = ''; msg.className='save-msg'; }, 4000);
    });
    bar.appendChild(btn);
    bar.appendChild(msg);
    container.appendChild(bar);
  }

  async function patchContent(partial){
    var merged = Object.assign({}, content, partial);
    var res = await apiPost('saveContent', { content: merged });
    if(!res || !res.ok) throw new Error((res && res.error) || 'save_failed');
    content = merged;
  }

    if(canManage){
      var addRow = document.createElement('div');
      addRow.className = 'add-btn-row';
      var b = document.createElement('button');
      b.className = 'btn ghost';
      b.textContent = '＋ 新增據點';
      b.addEventListener('click', function(){
        content.venues.push({
          id: uid('venue'), name: ensureL('新據點'), address: ensureL(''), status: ensureL('營業中'),
          transit: [], hours: [], mapPlaceholder: '待上傳：據點周邊地圖',
          hoursColor: null, mapImageAssetId: null, mapImageUrl: null
        });
        renderPanel('venue');
        focusPanelItem('venue');
      });
      addRow.appendChild(b);
      root.appendChild(addRow);
    }
  }

  // ================= 系統設定 =================
  function renderSystemPanel(root){
    panelHead(root, '系統設定', '設定三組權限密碼。請妥善保管，變更後請另行通知相關同仁。');

    var banner = document.createElement('div');
    banner.className = 'banner warn';
    banner.textContent = '密碼僅作為區分權限層級之用，非高安全性帳號機制，請勿使用其他系統共用的密碼。基於安全考量，這裡不會顯示目前設定的密碼——留空的欄位代表不變更，只有實際輸入新密碼的欄位才會被覆寫。';
    root.appendChild(banner);

    var card = document.createElement('div');
    card.className = 'card';
    var newPasswords = {};
    ['adminPass','marketingPass','opsPass'].forEach(function(key){
      var labels = { adminPass:'最高權限密碼', marketingPass:'行銷權限密碼', opsPass:'營運權限密碼' };
      var w = document.createElement('div'); w.className='field';
      w.innerHTML = '<label>' + labels[key] + '（留空＝不變更）</label>';
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = '輸入新密碼才會變更';
      inp.addEventListener('input', function(){ newPasswords[key] = inp.value; });
      w.appendChild(inp);
      card.appendChild(w);
    });
    saveBar(card, async function(){
      var payload = {};
      Object.keys(newPasswords).forEach(function(k){ if(newPasswords[k]) payload[k] = newPasswords[k]; });
      if(!Object.keys(payload).length){ throw new Error('未輸入任何新密碼'); }
      var res = await apiPost('setPasswords', { newPasswords: payload });
      if(!res || !res.ok) throw new Error((res && res.error) || 'save_failed');
    });
    root.appendChild(card);

    // ---- 各層級可存取分頁 ----
    content.systemSettings = content.systemSettings || {};
    content.systemSettings.rolePermissions = content.systemSettings.rolePermissions || {
      marketing: DEFAULT_ROLE_SECTIONS.marketing.slice(),
      ops: DEFAULT_ROLE_SECTIONS.ops.slice()
    };
    var rp = content.systemSettings.rolePermissions;

    var permCard = document.createElement('div');
    permCard.className = 'card';
    permCard.innerHTML = '<div class="card-head"><h3>各層級可存取分頁</h3></div>';

    var permBanner = document.createElement('div');
    permBanner.className = 'banner info';
    permBanner.textContent = '「最高權限」固定可存取全部分頁（含系統設定），不開放調整，避免不小心把自己鎖住；「系統設定」分頁也固定只有最高權限能看到，不開放給下面兩個角色勾選。取消勾選某分頁後，該角色登入時會直接看不到那個分頁。';
    permCard.appendChild(permBanner);

    var permittableSections = SECTION_DEFS.filter(function(s){ return s.id !== 'system'; });

    ['marketing','ops'].forEach(function(roleKey){
      var roleWrap = document.createElement('div');
      roleWrap.style.marginBottom = '16px';
      var roleTitle = document.createElement('p');
      roleTitle.style.fontWeight = '900';
      roleTitle.style.fontSize = '.85rem';
      roleTitle.style.marginBottom = '8px';
      roleTitle.textContent = ROLE_LABEL[roleKey] + '（' + roleKey + '）';
      roleWrap.appendChild(roleTitle);

      var grid = document.createElement('div');
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(140px, 1fr))';
      grid.style.gap = '8px';

      permittableSections.forEach(function(s){
        var lbl = document.createElement('label');
        lbl.style.display = 'flex';
        lbl.style.alignItems = 'center';
        lbl.style.gap = '6px';
        lbl.style.fontSize = '.85rem';
        lbl.style.fontWeight = '700';
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = (rp[roleKey] || []).indexOf(s.id) !== -1;
        cb.addEventListener('change', function(){
          var list = rp[roleKey] || [];
          if(cb.checked){
            if(list.indexOf(s.id) === -1) list.push(s.id);
          } else {
            list = list.filter(function(id){ return id !== s.id; });
          }
          rp[roleKey] = list;
        });
        lbl.appendChild(cb);
        lbl.appendChild(document.createTextNode(s.label));
        grid.appendChild(lbl);
      });

      roleWrap.appendChild(grid);
      permCard.appendChild(roleWrap);
    });

    saveBar(permCard, async function(){
      ['marketing','ops'].forEach(function(roleKey){
        if(!rp[roleKey] || !rp[roleKey].length){
          throw new Error(ROLE_LABEL[roleKey] + '至少要保留一個可存取的分頁，否則該角色登入後會完全看不到任何內容');
        }
      });
      await patchContent({ systemSettings: content.systemSettings });
      recomputeRoleSections();
      buildTabs();
    });
    root.appendChild(permCard);
  }

  console.log('%cVOLARE 後台 版本：v11（2026-09-23）', 'font-weight:bold;color:#dc6024;');
  console.log('本版更新：修正手機開啟時版面沒有縮放適配的問題（補上 viewport 設定）');

  init();
})();
</script>
